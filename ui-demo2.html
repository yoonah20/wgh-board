<!doctype html>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>외관 예시 2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*{box-sizing:border-box} body{margin:0;background:#e8e5e0;font:14px/1.5 'Pretendard Variable',Pretendard,sans-serif;color:#141416;padding:24px}
h1{font-size:21px;margin:0 0 4px} .lead{color:#6b6b72;margin:0 0 22px;font-size:13px} h2{font-size:16px;margin:30px 0 4px} .d{font-size:12.5px;color:#6b6b72;margin-bottom:12px}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start} .col{width:340px} .colh{font-size:12px;font-weight:700;color:#6b645c;margin:0 0 6px 4px}
.side{background:#efece7;border-radius:12px;padding:6px 0 8px}
.item{margin:6px 10px;padding:10px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;gap:12px;position:relative}
.thumb-col{display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.thumb{width:66px;height:88px;border-radius:8px;background:#d9d4cd;position:relative;overflow:hidden}
.heart{border:1px solid #f1d5dc;border-radius:99px;min-width:66px;height:26px;display:flex;align-items:center;justify-content:center;color:#6b6b72}
.nm{font-size:15px;font-weight:800;line-height:1.35} .sch{font-size:12.5px;color:#57534e}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px} .chip{font-size:11.5px;padding:1px 7px;border-radius:6px;background:#f3f1ee;color:#57534e}
.sum{background:#f6f4f1;border-radius:7px;color:#57534e;font-size:11.5px;line-height:1.45;padding:4px 8px;margin-top:5px;height:calc(3*1.45em + 8px);overflow:hidden}
.bibs{display:inline-block;color:#e11d48;box-shadow:inset 0 0 0 1px #e11d48;font-weight:800;font-size:11px;line-height:1;padding:3px 5px;border-radius:4px;vertical-align:2px;margin-right:6px}
svg.sil{position:absolute;inset:0;width:100%;height:100%}
/* NEW */
.n .thumb{width:76px;height:100px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.n .heart{min-width:76px}
.n .nm{font-size:16px;font-weight:800;letter-spacing:-.2px;line-height:1.3}
.n .sch{font-size:12.5px;color:#6b645c;margin-top:2px}
.n .chips{margin-top:6px} .n .chip{font-size:11px;background:transparent;box-shadow:inset 0 0 0 1px #e5e0d8;color:#6b645c;padding:1px 6px}
.n .sum{color:#44403c;font-size:12px;background:#f7f4ef;margin-top:7px}
.ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#8a837b;background:linear-gradient(160deg,#ece6dd,#ddd5c9)}
.ini small{position:absolute;bottom:6px;font-size:9.5px;font-weight:600;color:#a39a8e}
/* paper */
.papers{display:flex;gap:24px;flex-wrap:wrap}
.paper{width:300px;height:400px;background:#fff;padding:22px 24px;position:relative}
.paper.cur{box-shadow:0 2px 12px rgba(0,0,0,.12)}
.paper.new{box-shadow:0 0 0 1px rgba(60,40,20,.08),0 1px 2px rgba(60,40,20,.06),0 10px 28px -6px rgba(60,40,20,.18);border-radius:2px}
.paper .t{font-weight:900;font-size:18px;letter-spacing:3px;border-bottom:3px double #333;padding-bottom:6px}
.paper .ln{height:11px;background:#f1f1f1;margin:13px 0;border-radius:3px}.paper .ln.s{width:60%}
.lab{font-size:12px;color:#6b645c;margin-bottom:6px;font-weight:700}
</style>
<h1>외관 예시 2</h1><p class="lead">가짜 이름·회색 실루엣 예시(지원자 정보 없음). 왼쪽이 지금, 오른쪽이 바꾼 모습.</p>

<h2>2 · 사이드바 사진 칸 + 4 · 글자 위계</h2>
<div class="d">사진 칸을 66×88 → 76×100으로 키우고, 사진이 없는 지원자는 이름 첫 글자를 넣음. 이름은 더 크고 굵게, 학교는 한 단계 흐리게, 칩은 테두리만 남겨 가볍게.</div>
<div class="row"><div class="col"><div class="colh">지금</div><div class="side" id="a"></div></div><div class="col"><div class="colh">바꾼 모습</div><div class="side" id="b"></div></div></div>

<h2>3 · 지원서 종이 질감</h2>
<div class="d">하나의 큰 그림자 대신, 아주 얇은 테두리 + 가까운 그림자 + 멀리 퍼지는 그림자 세 겹으로 실제 종이가 놓인 느낌.</div>
<div class="papers"><div><div class="lab">지금</div><div class="paper cur"><div class="t">지 원 서</div><div class="ln"></div><div class="ln s"></div><div class="ln"></div><div class="ln s"></div><div class="ln"></div><div class="ln"></div><div class="ln s"></div></div></div>
<div><div class="lab">바꾼 모습</div><div class="paper new"><div class="t">지 원 서</div><div class="ln"></div><div class="ln s"></div><div class="ln"></div><div class="ln s"></div><div class="ln"></div><div class="ln"></div><div class="ln s"></div></div></div></div>
<script>
const sil='<svg class="sil" viewBox="0 0 66 88" preserveAspectRatio="xMidYMid slice"><rect width="66" height="88" fill="#d9d4cd"/><circle cx="33" cy="32" r="13" fill="#bdb6ad"/><path d="M8 88c2-20 12-30 25-30s23 10 25 30z" fill="#bdb6ad"/></svg>';
const H='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>';
const P=[{n:'김지우',no:22,s:'서울공연예술고등학교',c:['고2','실용음악과','09년생'],t:'○○엔터 연습생 1년 · 보컬 레슨 2년 · 교내 가요제 대상 · 메인보컬 지망',p:1},{n:'이하은',no:null,s:'선화예술고등학교',c:['중3 (입학 예정)','무용과','11년생'],t:'한국무용 7년 · 콩쿠르 금상 · 오디션 경력 없음 · 비주얼',p:0}];
const card=(a,neu)=>`<div class="item ${neu?'n':''}"><div class="thumb-col"><div class="thumb">${a.p?sil:(neu?`<div class="ini">${a.n[0]}<small>사진 없음</small></div>`:'')}</div><span class="heart">${H}</span></div><div style="flex:1;min-width:0"><div class="nm">${a.no?`<span class="bibs">#${a.no}</span>`:''}${a.n}</div><div class="sch">${a.s}</div><div class="chips">${a.c.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="sum">${a.t}</div></div></div>`;
a.innerHTML=P.map(x=>card(x,0)).join('');b.innerHTML=P.map(x=>card(x,1)).join('');
</script>
