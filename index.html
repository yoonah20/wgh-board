<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[대외비] WGH 지원자 명단</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* 레이아웃: 왼쪽 지원자 목록 + 오른쪽 A4 종이 지원서 묶음. 종이는 두 테마 모두 흰 종이 그대로. */
:root {
  --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-paper: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --bg: #efede8;
  --panel: #ffffff;
  --ink: #1d2129;
  --ink-2: #5b6270;
  --line: #d7dbe2;
  --accent: #2f5bd3;
  --accent-soft: #e6ecfb;
  --warn: #b26a00;
  --warn-soft: #fff3df;
  --danger: #c0352b;
  --danger-soft: #fde8e6;
  --paper: #ffffff;
  --paper-ink: #111;
  --paper-line: #333;
  --paper-head: #f2f2f2;
  --side-head: #f6f7f9;
  --row-line: #f0f1f4;
  --thumb: #e3e6eb;
  --memo: #fffef6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16181d; --panel: #1f2229; --ink: #e8eaef; --ink-2: #a2a9b6; --line: #343944;
  --accent: #7d9cf0; --accent-soft: #263150; --warn: #f0b45a; --warn-soft: #3a2e18;
  --danger: #f08378; --danger-soft: #3d2120; --side-head: #252932; --row-line: #2a2e37; --thumb: #2e333d;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #16181d; --panel: #1f2229; --ink: #e8eaef; --ink-2: #a2a9b6; --line: #343944;
  --accent: #7d9cf0; --accent-soft: #263150; --warn: #f0b45a; --warn-soft: #3a2e18;
  --danger: #f08378; --danger-soft: #3d2120; --side-head: #252932; --row-line: #2a2e37; --thumb: #2e333d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; padding-top: var(--tbh, 56px); }   /* 고정된 상단바 높이만큼 내용을 내림 */   /* 높이를 고정하면 상단바(sticky)가 한 화면 뒤에 같이 밀려 올라감 */
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--font-ui);
}
button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- 상단 바 ---------- */
.topbar {
  position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 40;   /* 항상 화면 맨 위에 고정 */
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.notice { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--accent-soft); color: var(--ink); font-size: 13px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.notice[hidden] { display: none; }
body.login-mode .side, body.login-mode .tb-center, body.login-mode .tb-right > * { display: none !important; }
body.login-mode .layout { grid-template-columns: 1fr; }
.login form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin: 14px 0 6px; }
.login form[hidden] { display: none; }
.login label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); flex: 1; min-width: 220px; }
.login input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 15px; background: var(--panel); color: var(--ink); }
#lgCode { letter-spacing: 6px; font-size: 18px; }
/* 워터마크: 종이(인쇄 포함)와 화면 전체 */
/* 워터마크: 지원서 종이에만, 글자 뒤에 옅게 (인쇄 포함) */
body.wm .sheet::before { content: ""; position: absolute; inset: 0; background: var(--wm-paper) center / 100% 100% no-repeat; pointer-events: none; z-index: 0; }
.sheet > :not(.foot) { position: relative; z-index: 1; }
.sheet > .foot { z-index: 1; }
.sheet.is-hidden::after { z-index: 2; }
/* 상단바·사이드바: 심사 메모(크림)·검토 상자(주황)와 어울리는 따뜻한 베이지 */
:root { --chrome: #f7f3ea; --chrome-head: #eee6d6; --chrome-line: #e0d6c2; }
:root[data-theme="dark"] { --chrome: #221f1a; --chrome-head: #2b2720; --chrome-line: #3b352b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --chrome: #221f1a; --chrome-head: #2b2720; --chrome-line: #3b352b; } }
.topbar { background: var(--chrome) !important; border-bottom-color: var(--chrome-line) !important; }
body::before { background: var(--chrome) !important; }
.side { background: var(--chrome) !important; border-right-color: var(--chrome-line) !important; }
.group-h { background: var(--chrome-head) !important; border-bottom-color: var(--chrome-line) !important; }
.item { border-bottom-color: var(--chrome-line) !important; }
.msg { color: var(--danger); font-size: 13px; }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.topbar h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; }
.stat { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.stat b { color: var(--accent); }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: #fff; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.icon { width: 34px; height: 32px; padding: 0; font-size: 17px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
#who { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 150px; background: var(--panel); }
.stat.sync.err { color: var(--danger); }
.topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
.tb-left, .tb-center, .tb-right { display: flex; align-items: center; gap: 8px 12px; min-width: 0; }
.tb-left { overflow: hidden; }
.tb-left .stat { overflow: hidden; text-overflow: ellipsis; }
.tb-right { justify-content: flex-end; flex-wrap: nowrap; }
@media screen and (max-width: 1100px) { .topbar { display: flex; } .tb-center { order: 3; width: 100%; justify-content: center; } .tb-right { margin-left: auto; } }
@media screen and (max-width: 1300px) { #q { width: 150px; } .topbar h1 { font-size: 15px; } }
.filters { position: relative; }
.filters > summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; user-select: none; }
.filters > summary::-webkit-details-marker { display: none; }
.filters > summary::after { content: "▾"; font-size: 11px; color: var(--ink-2); }
.filters:has(input:checked) > summary { border-color: var(--accent); color: var(--accent); }
.filters:has(input:checked) > summary::before { content: "●"; font-size: 8px; }
.filters .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; white-space: nowrap; }
#q { min-width: 0; width: 220px; height: 32px; }
.tb-left h1 { white-space: nowrap; }
#groupSel { -webkit-appearance: none; appearance: none; border: 1px solid var(--line); border-radius: 8px; height: 32px; padding: 0 34px 0 12px;
  background: var(--panel) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%235b6270' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'%2F%3E%3C%2Fsvg%3E") no-repeat right 12px center; color: var(--ink); cursor: pointer; font-size: 13px; }
#groupSel:hover { border-color: var(--accent); }
input[type=search] { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 180px; background: var(--panel); }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; white-space: nowrap; cursor: pointer; }

/* ---------- 레이아웃 ---------- */
.layout { display: grid; grid-template-columns: 350px 1fr; min-height: calc(100% - 56px); }
.side { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; max-height: calc(100vh - var(--tbh, 56px)); position: sticky; top: var(--tbh, 56px); }
.main { padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: auto; min-width: 0; }

.group-h {
  position: sticky; top: 0; z-index: 5; background: var(--side-head); border-bottom: 1px solid var(--line);   /* 사진 위로 */
  padding: 8px 14px; font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; cursor: pointer;
}
.group-h span { color: var(--ink-2); font-weight: 400; }
.item { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--row-line); cursor: pointer; }
.item:hover { background: var(--accent-soft); }
.item.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item.hidden-row { opacity: .5; }
.thumb { width: 60px; height: 80px; border-radius: 4px; background: var(--thumb); flex: none; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .nm { font-weight: 600; }
.item { align-items: flex-start; }
.item > div:last-child { min-width: 0; flex: 1; }
.item .sub { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .sum { font-size: 11.5px; color: var(--ink-2); opacity: .8; margin-top: 5px; line-height: 1.45; padding: 4px 7px; border-radius: 5px;
  border: 1px dashed color-mix(in srgb, var(--ink-2) 40%, transparent);   /* AI 요약은 점선 상자 */
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 99px; margin-left: 4px; vertical-align: 1px; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.hide { background: var(--danger-soft); color: var(--danger); }

/* ---------- 빈 화면 / 불러오기 ---------- */
.empty { max-width: 640px; margin: 40px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
.empty h2 { margin-top: 0; font-size: 18px; }
.empty ol { padding-left: 20px; color: var(--ink-2); }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 24px; text-align: center; margin: 16px 0; color: var(--ink-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
textarea.paste { width: 100%; height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 12px; }
.note { font-size: 12px; color: var(--ink-2); }

/* ---------- 종이 지원서 ---------- */
.sheet {
  width: 210mm; height: 297mm; margin: 0 auto 28px; background: var(--paper); color: var(--paper-ink);
  padding: 14mm 15mm 12mm; box-shadow: 0 2px 12px rgba(0,0,0,.12); position: relative;
  display: flex; flex-direction: column; overflow: hidden;
}
/* A4 한 장에 들어갈 본문. 넘치면 다음 쪽으로 넘김 (늘리지 않음) */
.sheet .body { flex: 1; min-height: 0; overflow: hidden; position: relative; }
.sheet .foot { position: absolute; right: 15mm; bottom: 5mm; font-size: 10px; color: #888; }
.blk.q + .blk.q table { margin-top: -1px; }
.blk.shrink td { font-size: 11px; line-height: 1.5; }
.sheet.is-hidden::after {
  content: "숨김 처리됨"; position: absolute; top: 14mm; left: 50%; transform: translateX(-50%) rotate(-8deg);
  border: 3px solid var(--danger); color: var(--danger); font-weight: 800; font-size: 22px; padding: 4px 16px; border-radius: 6px; opacity: .8;
}
.sheet-top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px double var(--paper-line); padding-bottom: 8px; margin-bottom: 14px; }
.sheet-top .ttl { font-family: var(--font-paper); font-size: 26px; font-weight: 900; letter-spacing: 4px; display: flex; align-items: center; gap: 10px; }
.sheet-top .ttl .logo { height: 16mm; width: auto; display: block; }
.sheet-top .meta { text-align: right; font-size: 12px; line-height: 1.6; }
.sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.sheet th, .sheet td { border: 1px solid var(--paper-line); padding: 6px 8px; font-size: 13px; vertical-align: middle; word-break: break-all; }
.sheet th { background: var(--paper-head); font-weight: 700; width: 24mm; text-align: center; word-break: keep-all; overflow-wrap: anywhere; }
.sheet .sec { font-weight: 800; font-size: 14px; margin: 16px 0 6px; padding-left: 8px; border-left: 5px solid var(--paper-line); }
.photo-cell { width: 36mm; padding: 0 !important; text-align: center; }
.photo-cell .photo { width: 100%; height: 46mm; background: #fafafa; display: flex; align-items: center; justify-content: center; color: #888; font-size: 12px; position: relative; }
.photo-cell .photo a { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #555; text-decoration: none; padding: 6px; }
.photo-cell .photo img, .file .fimg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.long { white-space: pre-wrap; min-height: 18mm; vertical-align: top !important; line-height: 1.7; }
.files { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.file { border: 1px solid var(--paper-line); text-decoration: none; color: inherit; display: block; }
.file .fimg { height: 30mm; background: #f3f3f3; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #999; position: relative; overflow: hidden; }
.file .fimg span { position: relative; z-index: 1; }
.file .fcap { font-size: 11px; padding: 3px 6px; border-top: 1px solid var(--paper-line); display: flex; justify-content: space-between; }
.file:hover .fcap { background: var(--paper-head); }
.flags { margin-top: 14px; border: 1px solid var(--warn); background: var(--warn-soft); color: #6b4300; padding: 8px 10px; font-size: 12px; }
.flags.hide { border-color: var(--danger); background: var(--danger-soft); color: #7a1c15; }
.memo { margin-top: 14px; }
.memo textarea { width: 100%; min-height: 22mm; border: 1px solid var(--paper-line); padding: 6px 8px; font-size: 13px; resize: vertical; background: var(--memo); color: var(--paper-ink); }
.sheet-actions { position: absolute; top: 6mm; right: 15mm; display: flex; gap: 6px; }
.sheet-actions .btn { font-size: 12px; padding: 3px 8px; }
.sign { margin-top: 18px; display: flex; justify-content: flex-end; gap: 24px; font-size: 12px; }

.grp-title { width: 210mm; margin: 8px auto 12px; font-weight: 800; font-size: 15px; color: var(--ink-2); }


/* 표 글자색: 다크 테마에서도 종이 위 글씨는 검정 */
.sheet, .sheet table, .sheet th, .sheet td { color: var(--paper-ink); }
.sheet th { color: #222; }
.sheet .btn { background: #fff; color: #111; border-color: #999; }
.sheet .btn:hover { border-color: #2f5bd3; }
/* 한 사람 = 2쪽, 양옆으로 */
.pair { display: flex; gap: 16px; justify-content: center; align-items: flex-start; margin: 0 auto 32px; }
.pair .sheet { margin: 0; flex: none; }
.grp-title { width: auto; max-width: calc(420mm + 16px); }
.files.photos { grid-template-columns: repeat(5, 1fr); gap: 6px; }
.files.photos .fimg { height: 44mm; }
.files.photos .fimg span { z-index: auto; }   /* '사진' 글자는 이미지가 없을 때만 보이게 */
/* 종이 위 요소는 테마와 상관없이 밝은 색 */
.sheet .flags { background: #fff3df; border-color: #b26a00; color: #6b4300; }
.sheet .flags.hide { background: #fde8e6; border-color: #c0352b; color: #7a1c15; }
.sheet .note { color: #666; }
.sheet .blk.q th, .sheet .blk.q td { font-size: 12px; line-height: 1.6; padding: 5px 7px; }
.vrow { margin-bottom: 10px; }
.vhead { font-size: 13px; margin: 6px 0; }
.files.videos { grid-template-columns: repeat(5, 1fr); gap: 6px; }
.file.video .fimg { height: 24mm; background: #222; color: #fff; }
/* 한 지원자의 쪽: 두 쪽 펼침 + 나머지는 뒤에 겹쳐서, ‹ › 로 넘김 */
.pair.deck { display: block; position: relative; margin: 0 auto 40px; max-width: none; isolation: isolate; z-index: 0;
  overflow-x: auto; overflow-y: hidden; box-sizing: content-box; padding-bottom: 10px; scrollbar-width: thin; }
.pair.deck.pan { cursor: grab; }
.pair.deck.dragging { cursor: grabbing; user-select: none; }
.pair.deck.dragging * { user-select: none; }
.deck-spacer { height: 1px; }
.pair, .grp-title { scroll-margin-top: calc(var(--tbh, 56px) + 14px); }
.pair.deck .sheet { box-shadow: 0 2px 10px rgba(0,0,0,.15); }
.pair.deck .sheet { position: absolute; top: 0; left: 0; margin: 0; transform-origin: 0 0; }
.pair.deck .sheet.back { box-shadow: 0 1px 6px rgba(0,0,0,.18); cursor: pointer; }
.pair.deck .sheet.back > * { visibility: hidden; }
.pair.deck .sheet.back::after { display: none; }
.deck-nav { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.dbtn { pointer-events: auto; position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 64px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 28px; line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.dbtn.prev { left: -52px; } .dbtn.next { right: -52px; }
.dbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.dbtn:disabled { opacity: .3; cursor: default; }
.dpg { position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.item { position: relative; }
.more { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--ink-2); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; cursor: pointer; opacity: 0; }
.item:hover .more, .item.sel .more, .more:focus-visible { opacity: 1; }
.more:hover { background: var(--line); color: var(--ink); }
.menu { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 4px; display: flex; flex-direction: column; min-width: 170px; }
.menu button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.menu button:hover, .menu button:focus-visible { background: var(--accent-soft); outline: none; }
@media (hover: none) { .more { opacity: 1; } }
@media print {
  .pair.deck { width: auto !important; height: auto !important; margin: 0; overflow: visible; padding: 0; }
  .deck-spacer { display: none; }
  .pair.deck .sheet { position: static; transform: none !important; }
  .pair.deck .sheet.back > * { visibility: visible; }
  body.print-one .pair:not(.print-target), body.print-one .grp-title { display: none !important; }
}
.grp-title { max-width: none; margin-left: 0; }
/* 메모·심사 체크는 마지막 쪽 맨 아래 */
.sheet .body { display: flex; flex-direction: column; }
.sheet .body > .blk { flex: none; }
.sheet .body > .blk.end { margin-top: auto; padding-top: 10px; flex: 1 0 auto; display: flex; flex-direction: column; }
.blk.end .memo { flex: 1; display: flex; flex-direction: column; min-height: 30mm; }
.blk.end .memo textarea { flex: 1; resize: none; min-height: 20mm; }
.paginating .sheet .body > .blk.end { flex: none; margin-top: 0; }

@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; }
  .topbar, .side, .sheet-actions, .grp-title, .no-print { display: none !important; }
  .layout { display: block; }
  .main { padding: 0; overflow: visible; }
  .sheet { box-shadow: none; margin: 0; page-break-after: always; break-after: page; }
  .sheet table, .files { break-inside: avoid; }
  /* 인쇄도 화면과 똑같이: 고정 상단바 자리 여백·그림자 없애고, 한 장 = A4 한 쪽 */
  html, body { padding: 0 !important; margin: 0 !important; background: #fff !important; }
  body::before, body::after { display: none !important; }
  .pair, .pair.deck { width: auto !important; height: auto !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
  .sheet, .pair.deck .sheet { position: relative !important; transform: none !important; box-shadow: none !important; margin: 0 !important;
    width: 210mm !important; height: 297mm !important; break-inside: avoid; page-break-inside: avoid; }
  .sheet { page-break-after: always; break-after: page; }
  .sheet.last-print { page-break-after: auto; break-after: auto; }   /* 맨 끝 빈 쪽 방지 */
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ===================== 테마: 캐스팅 갤러리형 (어두운 상단바 · 사진 카드 사이드바 · 로고 빨강 포인트) ===================== */
:root { --font-ui: 'Pretendard Variable', Pretendard, "Noto Sans KR", system-ui, sans-serif;
  --bg: #e8e5e0; --accent: #e11d48; --accent-soft: #ffe4ea; --ink: #141416; --ink-2: #6b6b72; --line: #dedad3;
  --chrome: #141416; --chrome-head: #efece7; --chrome-line: #2a2a2e; }
body { font-family: var(--font-ui); }
.topbar { background: #141416 !important; border-bottom: 1px solid #2a2a2e !important; color: #fff; }
body::before { background: #141416 !important; }
.topbar h1 { color: #fff; font-weight: 800; letter-spacing: .2px; }
.topbar .stat, .topbar .stat.sync { color: #a1a1aa; }

.topbar #q, .topbar #groupSel, .topbar .btn, .filters > summary { background-color: #1f1f23 !important; color: #e4e4e7 !important; border-color: #33333a !important; }
.topbar #q::placeholder { color: #8a8a93; }
.topbar #groupSel { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'%2F%3E%3C%2Fsvg%3E") !important; }
.topbar .btn:hover, .topbar #groupSel:hover, .topbar #q:focus { border-color: #fb7185 !important; }
.filters:has(input:checked) > summary { border-color: #fb7185 !important; color: #fb7185 !important; }
.filters .pop { color: var(--ink); background: #fff; }
.filters .pop input { accent-color: #e11d48; }
.layout { grid-template-columns: 340px 1fr; }
.side { background: #efece7 !important; border-right: 0 !important; padding: 0 0 24px; }   /* 위 여백 없이: 날짜 줄이 상단바에 딱 붙게 */
.group-h { background: #efece7 !important; border: 0 !important; font-size: 13px; color: #57534e; padding: 12px 18px 6px; }
.group-h span { color: #8a837b; }
.item { margin: 6px 10px; padding: 10px; border-radius: 12px; background: #fff; border: 0 !important; box-shadow: 0 1px 2px rgba(0,0,0,.06); gap: 12px; align-items: stretch; }

/* AI 요약: 항상 3줄 높이 (모자라면 빈칸, 넘치면 …) → 카드 높이가 모두 같음 */
.item .sum { border: 0 !important; background: #f6f4f1; border-radius: 7px; opacity: 1; color: #57534e; font-size: 11.5px; line-height: 1.45;
  padding: 4px 8px; margin-top: 5px; height: calc(3 * 1.45em + 8px); -webkit-line-clamp: 3; }
.heart { min-width: 66px; padding: 3px 0; font-size: 12px; border-color: #f1d5dc; background: #fff; }
.heart:hover { border-color: #e11d48; color: #e11d48; }
.heart.on { background: #ffe4ea; color: #e11d48; border-color: #fecdd6; }
.more { top: 10px; right: 10px; }
.main { background: #e8e5e0; }
.grp-title { color: #57534e; }
.badge.warn { background: #fff1e6; color: #c2410c; }
.badge.ok { background: #e7f6ec; color: #15803d; }
.menu { border-radius: 12px; }
.viewer { background: rgba(20,20,22,.94); }
.viewer .vbar { background: #141416; }
.login h2 { font-weight: 800; }
@media screen and (max-width: 1300px) { .layout { grid-template-columns: 310px 1fr; } }

/* ===================== 휴대폰 화면 (폭 760px 이하, 또는 가로로 눕힌 휴대폰) =====================
   목록 화면 → 누르면 한 사람 지원서 화면. 지원서는 A4로 나누지 않고 세로로 읽기 좋게 한 장으로 */
.mbar, .mfootnav { display: none; }

  body { font-size: 15px; }

  .heart { min-width: 72px !important; padding: 6px 0 !important; font-size: 14px !important; }
  .item .nm { font-size: 16px !important; padding-right: 28px; }

  body:not(.m-detail):not(.login-mode):has(.side .item) .main { display: none; }   /* 목록이 있을 때만 (로그인·불러오는 중 화면은 보이게) */

  .mbar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 40; height: 52px; background: #141416; color: #fff;
    align-items: center; gap: 4px; padding: 0 max(6px, env(safe-area-inset-right, 0px)) 0 max(6px, env(safe-area-inset-left, 0px)); }

  .mbar .mttl small { display: block; font-weight: 400; font-size: 11px; color: #a1a1aa; }
  .mbar .mheart { font-size: 20px; color: #fb7185; }
  .mbar .mnav { font-size: 24px; line-height: 1; }
  body.m-detail .mfootnav { display: flex; gap: 8px; padding: 4px 8px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .mfootnav button { flex: 1; min-width: 0; border: 0; border-radius: 12px; background: #fff; padding: 12px; font-size: 14px; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,.06); cursor: pointer; }

  /* 종이 → 세로로 읽는 카드 */

  .pair .sheet { cursor: auto; }
  .sheet { width: auto !important; height: auto !important; padding: 18px 16px 24px !important; margin: 0 !important; border-radius: 14px; overflow: hidden; }
  .sheet .body { overflow: visible; }
  .sheet > .zoom-hint { display: none; }
  body.wm .sheet::before { background: var(--wm-paper) 0 0 / 794px 1123px repeat; }   /* 글자 크기 그대로 반복 (늘어나지 않게) */

  .sheet-top .ttl { font-size: 18px; letter-spacing: 2px; gap: 6px; }

  .sheet .flags { font-size: 13.5px; }
  .review-btns .btn { padding: 8px 16px; font-size: 14px; }

/* ===================== 통계 화면 ===================== */
.stats { position: fixed; left: 0; right: 0; top: var(--tbh, 56px); bottom: 0; z-index: 39; background: #e8e5e0; overflow-y: auto; }
.stats > .sbar, .stats > .sgrid { max-width: 1440px; margin-inline: auto; }
.stats .sbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 12px max(20px, env(safe-area-inset-right, 0px)) 12px max(20px, env(safe-area-inset-left, 0px)); background: #e8e5e0; }

.dli:hover { background: #f6f4f1; }

.dli span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dli b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.dli b small { font-weight: 400; color: var(--ink-2); margin-left: 4px; }
/* 통계 배치: 왼쪽 학교 비중·입학 예정 | 학교별 목록 | 학년·출생연도 | 거주 지역, 맨 아래 일별 접수 */
.stats .slay { display: grid; gap: 14px; padding-top: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start;
  grid-template-areas: "donut list age region" "next list stage region" "daily daily daily daily"; }
.stats .slay > .card { align-self: stretch; }

/* 일별 접수: 세로 막대 */

function parseDelimited(text, delim) {
  const rows = []; let row = []; let cell = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows; // 빈 줄도 남겨 둬야 시트 행 번호가 맞음
}
function parseText(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split('\n').slice(0, 5).join('\n');
  const delim = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? '\t' : ',';
  return parseDelimited(text, delim);
}

function findHeaderRow(rows) {

  let best = 0, bestScore = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const score = rows[i].filter(c => FIELD_PATTERNS.some(([, re]) => re.test(c))).length;
    if (score > bestScore) { best = i; bestScore = score; }
  }

}

  headers.forEach((h, i) => {

      if (f === 'extra') break;
      if (f === 'skip') { map[i] = 'skip'; break; }
      // 이미 쓴 필드면 다음 패턴을 계속 봄 (예: '전공 (*2027년 입학 예정자는…)'은 진학 예정 다음으로 전공에)
      if (used.has(f) && !['photo', 'video', 'sns'].includes(f)) continue;
      map[i] = f; used.add(f); break;
    }
    if (!map[i] && COLUMN_HINTS[i] && !(COLUMN_HINTS[i] === 'appNo' && used.has('appNo'))) { map[i] = COLUMN_HINTS[i]; used.add(COLUMN_HINTS[i]); }

}

function buildApplicants(rows) {
  const hi = findHeaderRow(rows);
  const headers = rows[hi].map(norm);
  const map = mapHeaders(headers);
  const out = [];
  rows.slice(hi + 1).forEach((r, ri) => {
    const a = { extra: [], files: [], raw: r, row: hi + ri + 2 };
    let filled = 0;
    headers.forEach((h, i) => {
      const v = norm(r[i]);
      if (v) filled++;
      const f = map[i];
      if (f === 'skip') return;
      const ids = driveIds(v);
      if (ids.length) {
        const kind = f === 'photo' ? 'photo' : f === 'video' ? 'video' : 'file';
        const label = /노래|보컬|vocal/i.test(h) ? '노래 영상' : /댄스|춤|dance/i.test(h) ? '댄스 영상' : (h || '첨부');
        ids.forEach((id, k) => a.files.push({ id, kind, label, n: k + 1, many: ids.length > 1 }));
        return;
      }
      if (!h && !v) return;
      if (f && !['photo', 'video'].includes(f)) {
        if (a[f] && f === 'sns') a[f] += ' / ' + v; else a[f] = v;
      } else if (h) {

    const n = halfDigits(a.appNo).replace(/\D/g, '');
    a.appNo = n ? +n : null;
    a.school = canonSchool(a.school);
    a.ts = parseTimestamp(a.timestamp);
    a.b = parseBirth(a.birth);
    a.gradeN = normGrade(a);
    a.key = compact(a.name) + '|' + norm(a.birth || a.timestamp);
    const photo = a.files.find(f => f.kind === 'photo') || a.files[0];
    a.photoId = photo ? photo.id : null;

  });
  out.sort((x, y) => (x.ts || 0) - (y.ts || 0));

  const keyCount = {};
  out.forEach(a => { const n = keyCount[a.key] = (keyCount[a.key] || 0) + 1; if (n > 1) a.key += '#' + n; });
  // 지원번호는 시트 A열(스태프가 매긴 번호)만 씀. 비어 있으면 '번호 없음' — 시트에 번호가 생기면 다음 수집 때 달림.
  // 마지막 번호 행보다 위에서 비어 있는 행만 '스태프가 비워 둔 행'으로 봄 (아래쪽은 아직 번호를 안 받은 새 지원자)

  if (!gs.length) { side.innerHTML = '<div class="note" style="padding:14px">조건에 맞는 지원자가 없습니다.</div>'; return; }
  side.innerHTML = gs.map((g, gi) => `
    <div class="group-h" data-gi="${gi}">${esc(g.label)} <span>${g.items.length}명</span></div>
    ${g.items.map(a => `
      <div class="item ${a.key === selected ? 'sel' : ''} ${isHidden(a) ? 'hidden-row' : ''}" data-key="${esc(a.key)}">
        <button class="more" data-more title="숨김·승인 등" aria-label="더 보기">⋯</button>
        <div class="thumb-col"><div class="thumb">${repImg(a)}</div>
          <button class="heart ${myLike(a) ? 'on' : ''}" data-heart title="내 하트 (나만 보임)" aria-label="내 하트">${myLike(a) ? '♥' : '♡'}</button></div>
        <div style="min-width:0">
          <div class="nm">${esc(a.name) || '(이름 없음)'}${isHidden(a) ? '<span class="badge hide">숨김</span>' : needsReview(a) ? '<span class="badge warn">검토</span>' : ''}${stageBadge(a)}</div>
          <div class="sub">${[a.appNo != null ? '#' + a.appNo : '번호 없음', esc(sideSchool(a))].filter(Boolean).join(' · ')}</div>
          <div class="sub">${[a.b ? String(a.b.y).slice(2) + '년생' : '', esc(a.field || a.dept) || '전공 미기재'].filter(Boolean).join(' · ')}</div>
          ${SUMMARY[a.row] ? `<div class="sum">${esc(SUMMARY[a.row])}</div>` : ''}
        </div>
      </div>`).join('')}
  `).join('');
}

// 사이드바 학교: 중학생(2027 입학 예정)은 진학 예정 고등학교를 '(예정)'으로
function sideSchool(a) {
  if (/중학교|중$/.test(norm(a.school)) && /고등학교|고$|예고/.test(norm(a.nextSchool))) return `${canonSchool(a.nextSchool)} (예정)`;
  return a.school;
}
// 연락 상태 버튼 (지원서 1쪽 맨 아래, 인쇄 안 됨)
const contactRow = a => `<div class="contact no-print">${['', ...CONTACTS].map(v => `<button class="cbtn ${(contacts[a.key] || '') === v ? 'on' : ''}" data-contact="${v}">${v || '연락 전'}</button>`).join('')}</div>`;
function stageBadge(a) {
  const s = signs[a.key] || {}; const last = [...STAGES].reverse().find(t => s[t]);
  const c = contacts[a.key];
  return (last ? `<span class="badge ok">${last} ✓</span>` : '') + (c ? `<span class="badge ct ct${CONTACTS.indexOf(c)}">${c === '연락 완료' ? '✓ ' : c === '부재' ? '! ' : c === '고사' ? '× ' : ''}${c}</span>` : '') + (a.dupGroup && !isHidden(a) ? `<span class="badge dup" title="같은 사람이 ${a.dupGroup.length}번 지원 (시트 ${a.dupGroup.map(x => x.row).sort((x, y) => x - y).join(', ')}행) — 한 건만 표시">중복 ${a.dupGroup.length}</span>` : '');
}
// 사이드바 ⋯ 메뉴 항목
function menuItems(a) {
  const items = [[isHidden(a) ? 'toggle' : 'toggle', isHidden(a) ? '다시 표시' : '숨김 처리']];
  if (needsReview(a)) items.push(['approve', '승인 (검토 해제)']);
  else if (reviews[a.key] === 'ok') items.push(['unapprove', '승인 취소 (다시 검토)']);
  if (overrides[a.key]) items.push(['reset', '자동 판정으로 되돌리기']);
  items.push(['print', '이 지원서 인쇄']);
  return items;
}
function openMenu(btn) {
  closeMenu();
  const a = DATA.list.find(x => x.key === btn.closest('.item').dataset.key);
  const m = document.createElement('div'); m.className = 'menu'; m.id = 'itemMenu'; m.dataset.key = a.key;
  m.innerHTML = menuItems(a).map(([act, t]) => `<button data-mact="${act}">${t}</button>`).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect();
  m.style.top = `${Math.min(r.bottom + 4, window.innerHeight - m.offsetHeight - 8)}px`;
  m.style.left = `${Math.max(8, r.right - m.offsetWidth)}px`;
  m.querySelector('button').focus();
}
function closeMenu() { const m = document.getElementById('itemMenu'); if (m) m.remove(); }
document.addEventListener('click', e => {
  const mb = e.target.closest('[data-mact]');
  if (mb) { const k = mb.closest('.menu').dataset.key; closeMenu(); if (mb.dataset.mact === 'print') printPeople(k); else applyAct(k, mb.dataset.mact); return; }
  if (!e.target.closest('[data-more]') && !e.target.closest('#printBtn')) closeMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

// 전화번호 모양 맞추기: 01012345678 → 010-1234-5678 (숫자·공백·하이픈만 있는 값만 바꿈)
function fmtPhone(v) {
  const t = norm(v); if (!/^[\d\s\-+.()]+$/.test(t)) return t;
  let d = t.replace(/\D/g, '');
  if (d.startsWith('82') && d.length >= 11) d = '0' + d.slice(2);
  if (/^01\d{9}$/.test(d)) return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`;
  if (/^01\d{8}$/.test(d)) return `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;
  if (/^02\d{7,8}$/.test(d)) return `02-${d.slice(2, d.length - 4)}-${d.slice(-4)}`;
  if (/^0\d{9,10}$/.test(d)) return `${d.slice(0, 3)}-${d.slice(3, d.length - 4)}-${d.slice(-4)}`;
  return t;
}
function row(label, val, colspan) {
  return `<th>${label}</th><td${colspan ? ` colspan="${colspan}"` : ''}>${esc(val)}</td>`;
}

  [/데뷔/, '데뷔 경험'], [/소속사/, '소속사 연습기간'], [/오디션/, 'K-POP 오디션 경력'], [/출연/, '방송 광고 출연'],
  [/노래.*곡명/, '노래 곡명'], [/댄스.*곡명/, '댄스 곡명'], [/수상/, '수상 경력'], [/레슨/, '레슨 경험'],
  [/포지션/, '자신 있는 포지션'], [/워너비/, '워너비'], [/지원\s*동기/, '지원 동기'], [/자기\s*소개/, '자기소개'],
  [/예고|장래/, '예고 진학 이유 장래희망'], [/행복/, '가장 행복했던 순간'], [/힘들/, '가장 힘들었던 순간'],
  [/뽑혀야|팬들/, '뽑혀야 하는 이유 팬에게'], [/법정대리인\s*동의/, '법정대리인'], [/관계/, '대리인 관계'], [/대리인\s*연락처/, '대리인 연락처'],

    <a class="fimg" href="${viewUrl(f.id)}" target="_blank" rel="noopener" title="원본 열기"><span>사진</span><img src="${imgSrc(f.id)}" data-thumb="${esc(f.id)}" alt="" loading="lazy"></a>
    <div class="fcap"><span>${esc(cap)}</span>${isRep ? `<span class="no-print"><b class="rep-on">★ 대표</b>${isAdmin() ? ' <button class="rep-btn" data-crop>자르기</button>' : ''}</span>` : isAdmin() ? `<button class="rep-btn no-print" data-rep="${esc(f.id)}">대표로</button>` : ''}</div></div>`;

function fileCard(f, cap) {
  return `<a class="file ${f.kind}" href="${viewUrl(f.id)}" target="_blank" rel="noopener"${f.kind === 'video' ? ` data-vid="${esc(f.id)}" data-cap="${esc(cap)}"` : ''}>

    <div class="fcap"><span>${esc(cap)}</span><span class="no-print">${f.kind === 'video' ? '재생 ▶' : '열기 ↗'}</span></div></a>`;

function sheetHtml(a) {
  const hidden = isHidden(a);
  const isGuardian = e => /대리인|관계/.test(e.h);
  const guardian = a.extra.filter(isGuardian);
  const rest = a.extra.filter(e => !isGuardian(e) && !/곡명/.test(e.h));
  const song = re => (a.extra.find(e => re.test(e.h) && /곡명/.test(e.h)) || {}).v || '';
  // 'K-POP 관련 오디션 참가 경력'부터 2쪽으로
  let cut = rest.findIndex(e => /오디션/.test(e.h));
  if (cut < 0) cut = rest.length;
  const p1 = rest.slice(0, cut), p2 = rest.slice(cut);
  const blk = (html, cls = '', brk = false) => `<div class="blk ${cls}"${brk ? ' data-brk="1"' : ''}>${html}</div>`;
  const sec = (t, brk) => blk(`<div class="sec">${t}</div>`, 'sec-blk', brk);
  const qBlk = (label, v, brk) => blk(`<table><tr><th>${esc(label)}</th><td class="${v.length > 40 ? 'long' : ''}">${esc(v)}</td></tr></table>`, 'q', brk);
  const photos = a.files.filter(f => f.kind === 'photo');
  const others = a.files.filter(f => f.kind !== 'photo');
  const sing = others.filter(f => f.label === '노래 영상'), dance = others.filter(f => f.label === '댄스 영상');
  const etc = others.filter(f => !sing.includes(f) && !dance.includes(f));
  const snsVal = [a.snsType, a.sns].filter(Boolean).join(' · ');
  const reasons = hidden
    ? `<div class="flags hide"><b>숨김 사유:</b> ${esc(hideReasonsOf(a).join(', ') || '수동 숨김')}${a.warnReasons.length ? `<br><b>검토:</b> ${esc(a.warnReasons.join(', '))}` : ''}</div>`
    : needsReview(a) ? `<div class="flags"><b>검토 필요:</b> ${esc(a.warnReasons.join(', '))}
        <div class="review-btns no-print"><button class="btn ok" data-act="approve">승인</button><button class="btn" data-act="hide">숨김</button></div></div>`
    : a.warnReasons.length ? `<div class="flags done"><b>검토 완료 (승인):</b> ${esc(a.warnReasons.join(', '))} <button class="btn no-print" data-act="unapprove">되돌리기</button></div>` : '';
  // 사진은 3장씩 한 줄 = 한 블록 (줄 단위로 다음 쪽에 넘어갈 수 있게)
  const photoRows = [];
  for (let i = 0; i < photos.length; i += 5)
    photoRows.push(blk(`<div class="files photos">${photos.slice(i, i + 5).map(f => photoCard(f, `사진 ${f.n}`, f.id === photoOf(a))).join('')}</div>`));
  const blocks = [
    sec('인적 사항'),
    blk(`<table>
      <tr>${row('성명', a.name, 2)}<td class="photo-cell" rowspan="5">
        <div class="photo">
          ${photoOf(a) ? `<a href="${viewUrl(photoOf(a))}" target="_blank" rel="noopener">사진 원본 열기 ↗${repImg(a, '지원자 사진')}</a>${isAdmin() ? '<button class="crop-btn no-print" data-crop>✂ 얼굴 맞추기</button>' : ''}` : '사진 없음'}
        </div></td></tr>
      <tr>${row('생년월일', fmtBirth(a.b) || a.birth, 2)}</tr>
      <tr>${row('국적', a.nationality, 2)}</tr>
      <tr>${row('연락처', [fmtPhone(a.phone), norm(a.email)].filter(Boolean).join('  ·  '), 2)}</tr>
      <tr>${row('주소', a.address, 2)}</tr>
      ${guardian.length ? `<tr><th>보호자</th><td colspan="3">${guardian.map(e => esc(fmtPhone(e.v))).join(' · ')}</td></tr>` : ''}
      ${a.gender ? `<tr>${row('성별', a.gender, 3)}</tr>` : ''}
    </table>`),
    sec('학력 · 지원 분야'),
    blk(`<table>
      <tr>${row('재학 학교', a.school)}${row('학년', a.grade || a.gradeN)}</tr>
      <tr>${row('학과', a.dept)}${row('진학 예정', a.nextSchool)}</tr>
      <tr>${row('지원 분야', a.field, 3)}</tr>
      ${snsVal ? `<tr>${row('SNS', snsVal, 3)}</tr>` : ''}
    </table>`),
    ...p1.map(e => qBlk(shortLabel(e.h), e.v)),
    sec(`사진 (${photos.length}장)`),
    ...(photoRows.length ? photoRows : [blk('<div class="note">사진 없음</div>')]),
    ...(reasons ? [blk(reasons)] : []),
    sec('경력 · 자기소개', true),
    ...p2.map(e => qBlk(shortLabel(e.h), e.v)),
    blk(`<div class="sec">지원 영상<span class="hint no-print"> — 누르면 드라이브에서 재생됩니다</span></div>`, 'sec-blk vid-sec'),
    blk(`<div class="vhead"><b>노래</b> · ${esc(song(/노래/)) || '곡명 미기재'}${sing.length ? '' : ' (영상 없음)'}<br><b>댄스</b> · ${esc(song(/댄스/)) || '곡명 미기재'}${dance.length ? '' : ' (영상 없음)'}</div>
      <div class="files videos">${[...sing.map((f, i) => fileCard(f, `노래${sing.length > 1 ? ' ' + (i + 1) : ''}`)), ...dance.map((f, i) => fileCard(f, `댄스${dance.length > 1 ? ' ' + (i + 1) : ''}`))].join('')}</div>`),
    ...(etc.length ? [blk(`<div class="files">${etc.map(f => fileCard(f, f.label.slice(0, 12))).join('')}</div>`)] : []),
    blk(`<div class="memo"><div class="sec" style="margin-top:0">심사 메모</div>
      <textarea data-memo placeholder="${SYNC ? '여기에 메모하면 시트에 저장되어 함께 보는 사람들과 공유됩니다' : '여기에 메모하면 이 브라우저에 저장됩니다'}">${esc(memos[a.key] || '')}</textarea></div>
      <div class="sign">${STAGES.map(t => `<label class="${(signs[a.key] || {})[t] ? 'on' : ''}"><input type="checkbox" data-sign="${t}"${(signs[a.key] || {})[t] ? ' checked' : ''}><span class="t">${t}</span><span class="mk">✓</span></label>`).join('')}</div>`, 'end'),
  ];
  return `<section class="pair" id="s-${esc(a.key)}" data-key="${esc(a.key)}">${blocks.join('')}</section>`;
}

// 블록을 A4 쪽에 차례로 채우고, 넘치면 새 쪽을 만듦. 1쪽은 전체 머리말, 이후 쪽은 작은 머리말.
function paginate(secEl) {
  const a = DATA.list.find(x => x.key === secEl.dataset.key);
  const hidden = isHidden(a);
  const blks = [...secEl.children];
  secEl.innerHTML = '';
  secEl.classList.add('paginating');   // 쪽 나누는 동안엔 메모 칸이 늘어나지 않게 (높이 재기용)
  const pages = [];
  let body = null;
  const newPage = () => {
    const pg = document.createElement('article');
    pg.className = `sheet ${hidden ? 'is-hidden' : ''}`;
    pg.dataset.key = a.key;
    pg.innerHTML = `<div class="zoom-hint no-print" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg> 크게 보기</div>` + (pages.length === 0 ? `
      <div class="sheet-top">
        <div class="ttl">${titleHtml(SHEET_TITLE)}</div>
        <div class="meta">지원번호 <b>${a.no}</b><br>접수 ${esc(fmtTs(a.ts) || a.timestamp)}<br>시트 ${a.row}행<span class="pg-dot"> · </span><span data-pg></span></div>
      </div><div class="body"></div>${contactRow(a)}<div class="foot">${a.no} · ${esc(a.name)} · <span data-pg></span></div>`
      : `<div class="body"></div><div class="foot">${a.no} · ${esc(a.name)} · <span data-pg></span></div>`);
    secEl.appendChild(pg); pages.push(pg);
    body = pg.querySelector('.body');
  };
  // 인쇄하면 글자 폭이 화면보다 조금 넓어 줄이 늘어날 수 있어서, 아래에 여유(약 5mm)를 남김
  const fits = () => { if (isMobile()) return true; const l = body.lastElementChild; return !l || l.offsetTop + l.offsetHeight <= body.clientHeight - 18; };
  // 긴 답변 칸은 남은 자리만큼 잘라 넣고 나머지는 다음 쪽에 '(이어서)'로 이어 붙임
  const splitQ = b => {
    const td = b.querySelector('td'); if (!td) return null;
    const full = td.textContent;
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; td.textContent = full.slice(0, mid); if (fits()) lo = mid; else hi = mid - 1; }
    let n = lo;
    const cut = Math.max(full.lastIndexOf('\n', n), full.lastIndexOf('. ', n) + 1, full.lastIndexOf('다 ', n) + 1);
    if (cut > n * 0.6) n = cut;
    if (n < 40) { td.textContent = full; return null; }          // 너무 조금만 들어가면 통째로 넘김
    td.textContent = full.slice(0, n).trimEnd();
    const rest = b.cloneNode(true);
    rest.querySelector('td').textContent = full.slice(n).trimStart();
    const th = rest.querySelector('th'); if (th && !/이어서/.test(th.textContent)) th.textContent += ' (이어서)';
    return rest;
  };
  newPage();
  const queue = [...blks];
  while (queue.length) {
    const b = queue.shift();
    if (b.dataset.brk && body.children.length && !isMobile()) newPage();
    body.appendChild(b);
    if (fits()) continue;
    if (b.classList.contains('q')) { const rest = splitQ(b); if (rest) { queue.unshift(rest); newPage(); continue; } }
    if (body.children.length > 1) {
      body.removeChild(b);
      const prev = body.lastElementChild;           // 제목만 남지 않게 같이 넘김
      const carry = prev && prev.classList.contains('sec-blk') ? [body.removeChild(prev)] : [];
      newPage(); carry.forEach(c => body.appendChild(c)); body.appendChild(b);
      if (!fits() && b.classList.contains('q')) { const rest = splitQ(b); if (rest) { queue.unshift(rest); newPage(); } }
    }
  }
  pages.forEach((p, i) => { p.querySelectorAll('[data-pg]').forEach(e => { e.textContent = `${i + 1}/${pages.length}쪽`; }); });
  secEl.classList.remove('paginating');
}

// 3쪽 이상 넘어가는 지원자는 지원 영상을 3쪽으로 한꺼번에 넘김
// 휴대폰: A4로 나누지 않고 한 장으로 (CSS의 휴대폰 화면 조건과 같음)
const MOBILE_Q = matchMedia('screen and (max-width: 760px), screen and (max-height: 500px) and (pointer: coarse)');
const isMobile = () => MOBILE_Q.matches;
function layoutPair(secEl) {
  if (isMobile()) { paginate(secEl); return; }
  const orig = [...secEl.children].map(n => n.cloneNode(true));
  paginate(secEl);
  const pages = [...secEl.querySelectorAll('.sheet')];
  const vidPage = pages.findIndex(p => p.querySelector('.vid-sec'));
  if (pages.length >= 3 && vidPage >= 0 && vidPage < 2) {
    secEl.innerHTML = '';
    orig.forEach(n => { if (n.classList.contains('vid-sec')) n.dataset.brk = '1'; secEl.appendChild(n); });
    paginate(secEl);
  }
}
// 상단바 높이를 CSS 변수로 (줄바꿈되면 높이가 바뀜)
function syncTopbarH() { document.documentElement.style.setProperty('--tbh', document.querySelector('.topbar').offsetHeight + 'px'); }
if (window.ResizeObserver) new ResizeObserver(syncTopbarH).observe(document.querySelector('.topbar'));
syncTopbarH();
const deckPos = {};   // 지원자 key → 가로로 넘겨 둔 위치(px)
// 한 지원자의 모든 쪽을 한 줄로 펼침. 화면 너비에 맞춰 70%까지 줄이고, 그래도 넘치면 끌어서 옆으로 넘김
function setupDeck(pair) {
  const pages = [...pair.querySelectorAll('.sheet')];
  const MM = 96 / 25.4, W = 210 * MM, H = 297 * MM, gap = 16;   // A4 (확대 비율과 상관없이 고정)

// ===================== 대표 사진 자르기 (프로필 사진처럼 3:4) =====================
let cropState = null;
function openCrop(key) {
  if (!isAdmin()) return;
  const a = DATA.list.find(x => x.key === key); const id = photoOf(a); if (!id) return;
  const m = $('#cropModal'), img = $('#cImg');
  m.hidden = false; $('#cName').textContent = a.name;
  img.onload = () => {
    const ar = img.naturalWidth / img.naturalHeight;
    const wmax = Math.min(1, 3 / (4 * ar));
    const old = crops[key];
    cropState = old && old.id === id ? { ...old, ar, key, wmax } : { id, ar, key, wmax, w: wmax, cx: .5, cy: .5 };
    $('#cZoom').value = wmax / cropState.w; drawCrop();
  };
  img.removeAttribute('style');
  const show = () => {
    const deg = rotOf(id), ck = id + ':' + deg;
    img.dataset.wait = ck;
    const u = imgSrc(id);
    if (!deg || ROT[ck]) { img.src = u; if (img.complete && img.naturalWidth && img.src === u) img.onload(); }   // 회전본이 아직이면 rotateTo가 다 만든 뒤 넣어 줌
  };
  if (IMG[id] || !WEB) show(); else loadThumb(id).then(u => { if (u) show(); });
}
// 대표 사진 90도 회전 (회전하면 그 사진의 얼굴 맞추기는 처음부터)
function rotatePhoto(key, id, step) {
  const deg = ((rotOf(id) + step) % 360 + 360) % 360;
  rots[key] = rots[key] || {}; if (deg) rots[key][id] = deg; else delete rots[key][id];
  saveField(key, 'rot:' + id, deg ? String(deg) : '');
  if (crops[key] && crops[key].id === id) { delete crops[key]; saveField(key, 'crop', ''); }
  cropState = null; openCrop(key);
  rerender();
}
function clampCrop() {
  const c = cropState; c.w = Math.min(c.wmax, Math.max(c.wmax / 8, c.w));
  const hh = c.w * c.ar * 4 / 3;
  c.cx = Math.min(1 - c.w / 2, Math.max(c.w / 2, c.cx));
  c.cy = Math.min(1 - hh / 2, Math.max(hh / 2, c.cy));
}
function drawCrop() { clampCrop(); $('#cImg').setAttribute('style', cropStyle(cropState)); }
function closeCrop() { $('#cropModal').hidden = true; cropState = null; }
(() => {
  const frame = $('#cFrame'); let drag = null;
  frame.addEventListener('pointerdown', e => { if (!cropState) return; drag = { x: e.clientX, y: e.clientY }; frame.setPointerCapture(e.pointerId); });
  frame.addEventListener('pointermove', e => {
    if (!drag || !cropState) return;
    const c = cropState, W = frame.clientWidth, H = frame.clientHeight, hh = c.w * c.ar * 4 / 3;
    c.cx -= (e.clientX - drag.x) / W * c.w; c.cy -= (e.clientY - drag.y) / H * hh;
    drag = { x: e.clientX, y: e.clientY }; drawCrop();
  });
  frame.addEventListener('pointerup', () => drag = null);
  frame.addEventListener('wheel', e => {
    if (!cropState) return; e.preventDefault();
    cropState.w *= e.deltaY > 0 ? 1.08 : 1 / 1.08; drawCrop(); $('#cZoom').value = cropState.wmax / cropState.w;
  }, { passive: false });
  $('#cZoom').oninput = e => { if (!cropState) return; cropState.w = cropState.wmax / +e.target.value; drawCrop(); };
  $('#cRotL').onclick = () => { if (cropState) rotatePhoto(cropState.key, cropState.id, -90); };
  $('#cRotR').onclick = () => { if (cropState) rotatePhoto(cropState.key, cropState.id, 90); };
  $('#cReset').onclick = () => { if (!cropState) return; Object.assign(cropState, { w: cropState.wmax, cx: .5, cy: .5 }); $('#cZoom').value = 1; drawCrop(); };
  $('#cCancel').onclick = closeCrop;
  $('#cropModal').onclick = e => { if (e.target.id === 'cropModal') closeCrop(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#cropModal').hidden) closeCrop(); });
  $('#cSave').onclick = () => {
    const { key, id, cx, cy, w, ar } = cropState, r = n => Math.round(n * 10000) / 10000;
    crops[key] = { id, cx: r(cx), cy: r(cy), w: r(w), ar: r(ar) };
    saveField(key, 'crop', JSON.stringify(crops[key]));
    closeCrop();
    rerender();
  };
})();

function addIpToWatermark(viewer, now) {

// A4 한 장 크기(794×1123) 그림 하나에 문구를 비스듬히 촘촘하게 직접 배치 (반복·회전 없이 → 화면과 인쇄가 똑같음)
function setWatermark(text) {
  const FONT = 13, GAP = 64, ROW = 30, PW = 794, PH = 1123;
  const ctx = document.createElement('canvas').getContext('2d'); ctx.font = `${FONT}px sans-serif`;
  const W = Math.ceil(ctx.measureText(text).width) + GAP;
  const t = text.replace(/[<&"]/g, c => ({ '<': '&lt;', '&': '&amp;', '"': '&quot;' }[c]));
  let lines = '';
  const R = Math.hypot(PW, PH);   // 돌려도 빈 곳이 없게 대각선 길이만큼 깔기 (줄마다 글자 폭의 0.382배씩 밀어서 계단처럼 어긋나게)
  for (let r = 0, y = -R / 2; y < R / 2; r++, y += ROW)
    for (let x = -R / 2 - W + ((r * 0.382) % 1) * W; x < R / 2; x += W) lines += `<text x="${x.toFixed(0)}" y="${y.toFixed(0)}">${t}</text>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}" viewBox="0 0 ${PW} ${PH}"><g transform="translate(${PW / 2} ${PH / 2}) rotate(-28)" fill="rgba(0,0,0,0.075)" font-family="sans-serif" font-size="${FONT}">${lines}</g></svg>`;
  document.documentElement.style.setProperty('--wm-paper', `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`);
  document.body.classList.add('wm');
}

const loadLib = (url, name) => window[name] ? Promise.resolve(window[name]) : new Promise((res, rej) => {

const CDN = 'https:' + '/' + '/cdn.jsdelivr.net/npm/';

async function downloadPdfs(key) {
  if (viewerKey) closeViewer();
  const list = key ? DATA.list.filter(a => a.key === key) : visibleList();
  if (!list.length) return;
  logEv('PDF 다운로드', key ? list[0].name : `현재 목록 전체 ${list.length}명`, list.length > 1 ? 'ZIP' : '');
  try {
    setSyncStat('PDF 준비 중… (도구 불러오는 중)');
    await loadLib(CDN + 'html2canvas@1.4.1/dist/html2canvas.min.js', 'html2canvas');
    await loadLib(CDN + 'jspdf@2.5.1/dist/jspdf.umd.min.js', 'jspdf');
    if (list.length > 1) await loadLib(CDN + 'jszip@3.10.1/dist/jszip.min.js', 'JSZip');
    // 사진·썸네일 먼저 모두 받기
    const ids = WEB ? [...new Set(list.flatMap(a => a.files.map(f => f.id)))].filter(id => !IMG[id]) : [];
    let got = 0;
    if (ids.length) await Promise.all(ids.map(id => loadThumb(id).then(() => setSyncStat(`PDF 준비 중… 사진 ${++got}/${ids.length}`))));
    const stage = document.createElement('div'); stage.className = 'pdf-stage'; document.body.appendChild(stage);
    const zip = list.length > 1 ? new window.JSZip() : null;
    let lastBlob = null;
    for (let n = 0; n < list.length; n++) {
      const a = list[n], pair = document.getElementById('s-' + a.key); if (!pair) continue;
      setSyncStat(`PDF 만드는 중… ${n + 1}/${list.length} · ${a.name}`);
      const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
      const sheets = [...pair.querySelectorAll('.sheet')];
      for (let i = 0; i < sheets.length; i++) {
        const cl = sheets[i].cloneNode(true); cl.style.transform = 'none';
        cl.querySelectorAll('textarea').forEach((t, k) => { const src = sheets[i].querySelectorAll('textarea')[k]; const d = document.createElement('div'); d.className = 'memo-print'; d.textContent = src ? src.value : ''; t.replaceWith(d); });
        stage.innerHTML = ''; stage.appendChild(cl); fitCrops(stage);
        const canvas = await window.html2canvas(cl, { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true });
        if (i) doc.addPage();
        doc.addImage(canvas.toDataURL('image/jpeg', 0.88), 'JPEG', 0, 0, 210, 297);
      }
      const blob = doc.output('blob');
      if (zip) {   // 같은 이름이 있으면 (2), (3)… 붙임
        let nm = pdfName(a), k = 2; while (zip.file(nm)) nm = pdfName(a).replace(/\.pdf$/, ` (${k++}).pdf`);
        zip.file(nm, blob);
      } else lastBlob = blob;
    }
    stage.remove();
    const out = zip ? await zip.generateAsync({ type: 'blob' }) : lastBlob;
    const md = (COLLECTED || '').split(' ')[0].replace('/', '');
    const link = document.createElement('a'); link.href = URL.createObjectURL(out);
    link.download = zip ? `WGH 지원서 ${md || ''} (${list.length}명).zip`.replace('  ', ' ') : pdfName(list[0]);
    document.body.appendChild(link); link.click(); setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 5000);
    setSyncStat(collectedText());
  } catch (err) {
    document.querySelectorAll('.pdf-stage').forEach(x => x.remove());
    setSyncStat('PDF 만들기 실패: ' + (err && err.message || err), true);
  }
}

function dailyCols(list) {
  const days = list.map(a => a.ts).filter(Boolean).sort((x, y) => x - y);
  if (!days.length) return '<div class="note">해당 없음</div>';
  const cnt = new Map(); list.forEach(a => { if (a.ts) { const k = dayKey(a.ts); cnt.set(k, (cnt.get(k) || 0) + 1); } });
  const out = [], d = new Date(days[0].getFullYear(), days[0].getMonth(), days[0].getDate()), end = new Date();
  for (; d <= end; d.setDate(d.getDate() + 1)) out.push([new Date(d), cnt.get(dayKey(d)) || 0]);
  const max = Math.max(...out.map(x => x[1])), step = Math.max(1, Math.ceil(out.length / 10));
  const maxI = out.findIndex(x => x[1] === max), lastI = out.length - 1;
  return `<div class="cols">${out.map(([dt, n], i) => `<div class="c" title="${dayLabel(dt)} · ${n}명"><i style="height:${max ? n / max * 100 : 0}%"></i>${(i === maxI || i === lastI) && n ? `<b style="bottom:calc(${n / max * 100}% + 2px)">${n}</b>` : ''}</div>`).join('')}</div>
    <div class="cols-x">${out.map(([dt], i) => `<span>${i % step === 0 || i === lastI ? `${dt.getMonth() + 1}/${dt.getDate()}` : ''}</span>`).join('')}</div>`;
}
// 학교 비중 원형 그래프: 상위 6곳 + 그 외 (색은 순서 고정)
const DONUT_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300'], DONUT_REST = '#d6d3d1';
function donut(rows, total) {
  if (!total) return '<div class="note">해당 없음</div>';
  const top = rows.filter(r => !/미기재/.test(r[0])).slice(0, DONUT_COLORS.length);
  const restN = total - top.reduce((s, r) => s + r[1], 0);
  const segs = [...top.map((r, i) => [r[0], r[1], DONUT_COLORS[i], true]), ...(restN ? [[`그 외 ${rows.length - top.length}곳`, restN, DONUT_REST, false]] : [])];
  const R = 70, C = 90, W = 30;
  let a0 = -Math.PI / 2;
  const arcs = segs.map(([k, n, col]) => {
    const a1 = a0 + n / total * Math.PI * 2, gap = segs.length > 1 ? 0.012 : 0;
    const s0 = a0 + gap, s1 = Math.max(s0 + 0.001, a1 - gap), big = s1 - s0 > Math.PI ? 1 : 0;
    const P = a => `${(C + R * Math.cos(a)).toFixed(2)} ${(C + R * Math.sin(a)).toFixed(2)}`;
    const d = segs.length === 1 ? `M ${C} ${C - R} A ${R} ${R} 0 1 1 ${C - 0.01} ${C - R}` : `M ${P(s0)} A ${R} ${R} 0 ${big} 1 ${P(s1)}`;
    a0 = a1;
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${W}"><title>${esc(k)} · ${n}명 (${Math.round(n / total * 100)}%)</title></path>`;
  }).join('');
  return `<div class="donut"><svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="학교별 비중">${arcs}
      <text x="90" y="88" text-anchor="middle" class="dn">${total}</text><text x="90" y="108" text-anchor="middle" class="dl">명</text></svg>
    <div class="dleg">${segs.map(([k, n, col, click]) => `<div class="dli ${click ? 'click' : ''}" ${click ? `data-q="${esc(k)}"` : ''} title="${esc(k)} · ${n}명"><i style="background:${col}"></i><span>${esc(k)}</span><b>${n}<small>${Math.round(n / total * 100)}%</small></b></div>`).join('')}</div></div>`;
}

function applyAct(key, act) {
  const a = DATA.list.find(x => x.key === key); if (!a) return;
  if (act === 'approve' || act === 'unapprove') {
    if (act === 'approve') reviews[a.key] = 'ok'; else delete reviews[a.key];
    saveField(a.key, 'review', reviews[a.key] || '');
  } else {
    if (act === 'hide') overrides[a.key] = 'hide';
    else if (act === 'toggle') overrides[a.key] = isHidden(a) ? 'show' : 'hide';
    else delete overrides[a.key];
    // 자동 판정과 같아지면 오버라이드 제거
    if (overrides[a.key] && !a.dupGroup && (overrides[a.key] === 'hide') === (a.hideReasons.length > 0)) delete overrides[a.key];   // 중복 묶음은 직접 고른 것을 그대로 둠
    saveField(a.key, 'override', overrides[a.key] || '');
  }
  rerender();
}

function showLogin(msg) {
  SESSION = ''; store.set('session', ''); document.body.classList.add('login-mode');
  DATA = null; $('#side').innerHTML = ''; $('#stat').textContent = ''; if (document.getElementById('wmBtn')) $('#wmBtn').hidden = true;
  $('#adminBtn').hidden = true;
  const sync = document.getElementById('syncStat'); if (sync) sync.hidden = true;
  $('#main').innerHTML = `
    <div class="empty login">
      <h2>WE GO HIGH 지원자 명단</h2>
      <p class="note">프로젝트 Slack 채널 멤버만 볼 수 있습니다. 등록된 이메일로 인증코드를 보내 드립니다.</p>
      <form id="loginEmail"><label>이메일<input type="email" id="lgEmail" required autocomplete="email" placeholder="name@monsterahaus.com"></label>
        <button class="btn primary" id="lgSend">인증코드 받기</button></form>
      <form id="loginCode" hidden><label>인증코드 (6자리)<input type="text" id="lgCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></label>
        <button class="btn primary">확인</button> <button type="button" class="btn" id="lgBack">이메일 다시 입력</button></form>
      <p class="msg" id="lgMsg" role="alert">${esc(msg || '')}</p>
      <p class="note">한 번 인증하면 이 브라우저에서는 1년 동안 다시 묻지 않습니다.</p>
    </div>`;
  const msgEl = $('#lgMsg'), say = (t, ok) => { msgEl.textContent = t; msgEl.style.color = ok ? 'var(--ink-2)' : ''; };
  $('#lgEmail').value = store.get('loginEmail', '');
  $('#loginEmail').onsubmit = e => {
    e.preventDefault();
    const email = norm($('#lgEmail').value).toLowerCase(); store.set('loginEmail', email);
    $('#lgSend').disabled = true; say('보내는 중…', true);
    gs('requestCode', email).then(r => {
      $('#lgSend').disabled = false;
      if (!r.ok) return say(r.msg);
      $('#loginEmail').hidden = true; $('#loginCode').hidden = false; $('#lgCode').focus();
      say(`${email} 로 인증코드를 보냈습니다. 메일이 안 보이면 스팸함도 확인해 주세요. (등록된 이메일일 때만 발송됩니다)`, true);
    }).catch(err => { $('#lgSend').disabled = false; say('보내지 못했습니다: ' + (err && err.message || err)); });
  };
  $('#lgBack').onclick = () => { $('#loginCode').hidden = true; $('#loginEmail').hidden = false; say(''); };
  $('#loginCode').onsubmit = e => {
    e.preventDefault();
    say('확인 중…', true);
    gs('verifyCode', store.get('loginEmail', ''), $('#lgCode').value).then(r => {
      if (!r.ok) return say(r.msg);
      SESSION = r.session; store.set('session', SESSION);
      webLoad(true);
    }).catch(err => say('확인하지 못했습니다: ' + (err && err.message || err)));
  };
  setTimeout(() => $('#lgEmail').focus(), 50);
}
if (WEB) {
  SESSION = store.get('session', '');
  if (SESSION) webLoad(true); else showLogin();
  // 10분마다 시트를 다시 수집 (새 지원자 반영). 메모 입력 중이거나 창이 안 보이면 건너뜀
  setInterval(() => {
    const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches('textarea, input');
    if (SESSION && !document.hidden && !typing && $('#cropModal').hidden && !viewerKey) webLoad(false);
  }, 10 * 60 * 1000);
  // 관리자 메뉴: 워터마크 켜기/끄기, 활동 기록
  $('#adminBtn').onclick = e => {
    e.stopPropagation();
    if (document.getElementById('itemMenu')) { closeMenu(); return; }
    const m = document.createElement('div'); m.className = 'menu'; m.id = 'itemMenu';
    m.innerHTML = `<button data-admin="wm">워터마크 ${wmOn() ? '끄기' : '켜기'} <em>(지금 ${wmOn() ? '켜짐' : '꺼짐'})</em></button>
      <button data-admin="log">활동 기록 보기</button>`;
    document.body.appendChild(m);
    const r = $('#adminBtn').getBoundingClientRect();
    m.style.top = `${r.bottom + 4}px`; m.style.left = `${Math.max(8, r.right - m.offsetWidth)}px`;
  };
  document.addEventListener('click', e => {
    const ab = e.target.closest('[data-admin]'); if (!ab) return;
    closeMenu();
    if (ab.dataset.admin === 'wm') { SETTINGS = { ...SETTINGS, watermark: wmOn() ? '0' : '1' }; updateWatermark(); saveField('_settings', 'watermark', SETTINGS.watermark); }
    else openLog();
  });
}
else if (EMB) { const e = JSON.parse(EMB.textContent); load(e.csv, false, e.asOf); }
else load(SAMPLE, true);
if (SYNC) {
  if (!WEB) { const who = $('#who'); who.hidden = false; who.value = store.get('who', '');
    who.onchange = () => store.set('who', norm(who.value)); }
  if (!WEB || SESSION) setSyncStat('공유 연결 중…');
  if (!WEB) pullState(true);
  setInterval(() => { if (!document.hidden && (!WEB || SESSION)) pullState(); }, 30000);
  window.addEventListener('focus', () => { if (!WEB || SESSION) pullState(); });
}
})();
</script>
